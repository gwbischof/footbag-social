<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit club</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    .wf { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; }
    .box { background: #E4E3DF; border: 1px solid #C2C0BA; }
    .lbl { color: #6E6B64; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 5px; }
    .fld { background: #E4E3DF; border: 1px solid #C2C0BA; height: 38px; display: flex; align-items: center; padding: 0 11px; font-size: 13px; }
    .grp { padding: 0 16px 14px; }
  </style>
</helmet>

<div class="wf" style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #2E2C28; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #DAD8D2">
    <a href="Club.dc.html" style="font-size: 14px; color: #6E6B64; text-decoration: none">Cancel</a>
    <strong style="font-size: 15px; font-weight: 600">Edit club</strong>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 500; border: 0; background: none; color: #2E2C28">Save</button>
  </div>

  <div style="padding: 16px; display: flex; align-items: center; gap: 13px">
    <div class="box" style="width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #8A867D">logo</div>
    <button type="button" style="font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid #C2C0BA; background: transparent">Change logo</button>
  </div>

  <div class="grp">
    <label class="lbl" for="cn">Club name</label>
    <div class="fld" id="cn">Brooklyn Footbag</div>
  </div>

  <div class="grp">
    <label class="lbl" for="cd">Description</label>
    <div class="box" id="cd" style="height: 62px; padding: 10px; box-sizing: border-box; font-size: 13px; color: #8A867D">who you are, when you play…</div>
  </div>

  <div class="grp">
    <span class="lbl">Where you play</span>
    <div class="box" style="height: 92px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6E6B64; text-transform: uppercase; letter-spacing: .04em">map · drop a pin</div>
    <div class="fld" style="margin-top: 7px">McCarren Park, Brooklyn</div>
    <div style="font-size: 11px; color: #6E6B64; margin-top: 5px">Public. This is what puts the club in Discover.</div>
  </div>

  <div style="padding: 0 16px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div>
      <div style="font-size: 13px; font-weight: 500">Who can post to the club</div>
      <div style="font-size: 11px; color: #6E6B64">Members only, or anyone</div>
    </div>
    <span style="font-size: 13px; color: #8A867D; white-space: nowrap">Members ›</span>
  </div>

  <a href="ClubMembers.dc.html" style="border-top: 1px solid #DAD8D2; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit">
    <span style="font-size: 14px">Organisers</span>
    <span style="font-size: 13px; color: #8A867D">2 ›</span>
  </a>
  <a href="ClubMembers.dc.html" style="border-top: 1px solid #DAD8D2; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit">
    <span style="font-size: 14px">Members &amp; requests</span>
    <span style="font-size: 13px; color: #8A867D">24 · 2 waiting ›</span>
  </a>
  <div style="border-top: 1px solid #DAD8D2; border-bottom: 1px solid #DAD8D2; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 14px">Sessions</span>
    <span style="font-size: 13px; color: #8A867D">weekly ›</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 14px 16px 20px">
    <button type="button" style="font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 999px; border: 1px solid #C2C0BA; background: transparent; color: #8A3A3A">Delete club</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
