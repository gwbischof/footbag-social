# Port 8080, not 80: the image is nginx-unprivileged so the container can run
# as a non-root user, which the cluster requires.
server {
    server_tokens off;

    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Flutter web ships a multi-megabyte main.dart.js; serving it uncompressed
    # dominates first load.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/wasm image/svg+xml
                     application/manifest+json;

    # Content Security Policy. CanvasKit paints to a canvas rather than the DOM,
    # so a hostile Matrix message is not a DOM-XSS vector and this is defence in
    # depth -- except for connect-src, which is load-bearing: the access token
    # and E2EE keys live in IndexedDB, and prepare-web.sh pulls third-party JS
    # (native_imaging) into this origin at build time. connect-src is what stops
    # any of that being posted somewhere else.
    #
    # The policy itself is generated at build time by scripts/gen-csp.py,
    # which hashes Flutter's inline bootstrap script -- its content changes on
    # every build, so a hash committed here would break the next rebuild.
    include /etc/nginx/csp.conf;

    # csp.conf only does `set $csp "..."`, so this is the one place the header
    # is actually emitted for locations that declare no add_header of their own
    # -- notably the SPA fallback below, which serves index.html for every
    # route that is not a file. Without this, only the three exact-match
    # locations further down carried a policy and every other document was
    # served with none.
    add_header Content-Security-Policy $csp always;

    # Never cache the entry point or the service worker. They are how a client
    # discovers a new build; a stale copy pins users to the old one
    # indefinitely, and the worker then keeps serving it offline.
    #
    # nginx only inherits add_header from an outer block when the inner block
    # declares none of its own, so every location that sets Cache-Control must
    # repeat the CSP rather than relying on a server-level one.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
    }

    # The one genuinely version-pathed directory can be cached hard.
    location ~* ^/assets/assets/vodozemac/[^/]+/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Flutter emits STABLE filenames (main.dart.js, canvaskit.wasm, assets/...),
    # not content-addressed ones. The same URL therefore holds different bytes
    # after every deploy, so it cannot carry a freshness lifetime at all.
    #
    # This was "max-age=86400, must-revalidate", which looks cautious and is
    # not: must-revalidate only applies once max-age has expired, so for a day
    # after each deploy Cloudflare kept serving the previous build from its
    # edge without ever asking us. A deploy would go out, the pods would be
    # running the new image, and the site would still be the old app -- which
    # is exactly how it failed on 2026-10-24.
    #
    # max-age=0 means store it, but check with us before serving it. ETags make
    # that check a 304 with no body, so the bytes are still only sent when they
    # actually changed. Correctness here is worth one conditional request.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|json|webp)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Terms and Privacy. The pages are not in this image: the deployment mounts
    # them at /usr/share/nginx/html/legal from a ConfigMap rendered from the
    # private business repo, so a fork of this app never serves our legal text
    # (it gets a 404 here until it mounts its own). Exact-match so the SPA
    # fallback below cannot swallow them, and no-cache so an edit shows at once.
    location = /terms {
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        try_files /legal/terms.html =404;
    }
    location = /privacy {
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        try_files /legal/privacy.html =404;
    }

    # The bundled fonts, also used by the sign-up pages on chat.footbagsocial.com
    # so those load nothing from Google. Fonts are CORS-checked, so that origin
    # needs the header; ^~ wins over the extension regex above, so this block
    # repeats its cache and CSP headers.
    location ^~ /assets/assets/fonts/ {
        add_header Access-Control-Allow-Origin "https://chat.footbagsocial.com" always;
        add_header Vary Origin always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # CanvasKit's Roboto and Noto fallback fonts. The engine fetches these from
    # fonts.gstatic.com by default, which hands every visitor's IP to Google;
    # web/index.html points fontFallbackBaseUrl here instead, so Google sees
    # this pod and Cloudflare's edge caches the files for everyone after.
    # Mirroring the whole Noto chain into the image would be hundreds of MB.
    #
    # ^~ so this prefix beats the font-extension regex above, which would
    # otherwise try_files them from disk and 404. Nothing identifying is passed
    # upstream: no cookies, no referrer, no forwarded-for. proxy_max_temp_file_size
    # 0 streams large files instead of spilling them to the read-only disk.
    location ^~ /gstatic/ {
        proxy_pass                https://fonts.gstatic.com/;
        proxy_ssl_server_name     on;
        proxy_set_header          Host fonts.gstatic.com;
        proxy_set_header          Cookie "";
        proxy_set_header          Referer "";
        proxy_set_header          X-Forwarded-For "";
        proxy_hide_header         Set-Cookie;
        # Google's own reporting headers would otherwise register its report
        # collector for this origin in the visitor's browser, sending the
        # browser to Google after all.
        proxy_hide_header         Report-To;
        proxy_hide_header         NEL;
        proxy_hide_header         Content-Security-Policy-Report-Only;
        proxy_hide_header         Cross-Origin-Opener-Policy;
        proxy_hide_header         Alt-Svc;
        proxy_max_temp_file_size  0;
    }

    # Routing is hash-based today, so this fallback is not load-bearing; it is
    # here so switching Flutter to path URLs does not silently start 404ing
    # on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Matrix server discovery. The homeserver's server_name is this apex, but
    # Synapse runs at chat.footbagsocial.com, so these two files are what point
    # clients and other servers at the real host. They are served here because
    # the apex is this app -- Synapse never sees a request for them.
    #
    # Access-Control-Allow-Origin is load-bearing, not boilerplate: a Matrix
    # client on any other origin fetches these cross-origin, and the spec
    # requires the header. It is easy to miss because a client served from this
    # same origin works without it.
    location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 '{"m.server": "chat.footbagsocial.com:443"}';
    }
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 '{"m.homeserver": {"base_url": "https://chat.footbagsocial.com"}}';
    }

    # Probe target that does not pull the whole app shell.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
